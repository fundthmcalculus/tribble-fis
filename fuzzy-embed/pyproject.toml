[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzyembed"
version = "0.1.0"
description = "FES - text embeddings from a Takagi-Sugeno-Kang fuzzy inference system"
requires-python = ">=3.12"
dependencies = [
    "torch", "sentence-transformers>=5.0", "mteb", "datasets",
    "transformers", "tokenizers", "scikit-learn", "numpy", "pandas", "matplotlib",
]

[tool.hatch.build.targets.wheel]
packages = ["fuzzyembed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Dependency Sync

# Keeps the git-sourced dependencies -- `optimizers` and `tribble-clustering` --
# tracking their upstream `main`, in both `pyproject.toml` and `uv.lock`.
#
# The mechanism has to match how the pins are written, and that has changed
# once already:
#
#   * Originally the sources were bare git URLs with no `rev`. uv resolved the
#     branch head once and pinned it in the lock forever, and `uv lock --check`
#     could not see the drift -- a revision-less git source is "in sync" with
#     whatever commit is already locked, however old. This workflow was written
#     for that state, and `uv lock --upgrade-package` was the whole of it.
#
#   * #219 then pinned explicit revisions, so the intended commit shows up in a
#     diff where a reviewer already looks. That is a better pin, and it made
#     this workflow inert: with a `rev` present there is nothing for
#     `--upgrade-package` to upgrade to, so the re-resolve is a fixed point.
#     Measured on `ae0ef13`, with optimizers 4 commits behind upstream and
#     clustering 7 behind, it produced a zero-byte `uv.lock` diff and this
#     workflow reported "nothing to do" on every scheduled run until a human
#     typed the SHAs by hand in #221.
#
# So the `rev` in `pyproject.toml` is now rewritten first, by
# scripts/sync_git_pins.py, and `uv lock` follows to match. Both files move
# together and the bump stays reviewable. tests/test_sync_git_pins.py fails if
# this workflow stops calling that script, because a sync job that finds no
# drift and one that *cannot* find drift look identical from the outside.
#
# Triggered directly by each upstream's notify-downstream.yml (see the
# repository_dispatch below), with a twice-daily cron as a backstop for when the
# dispatch token is absent or a dispatch is lost.
on:
  repository_dispatch:
    types: [upstream-updated]
  schedule:
    # Twice a day, per the ask on #201. A single daily run means an upstream fix
    # merged just after it waits nearly 24 hours -- and the fixes that motivated
    # #201 were seeding/determinism fixes, where a day of downstream runs on the
    # old code produces results that look fine and are not reproducible.
    - cron: '0 7,19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

env:
  SYNC_BRANCH: chore/dependency-sync

# Two upstreams merging at once would otherwise race to force-push the same
# branch, and the loser's re-resolve is thrown away. Serialize instead of
# cancelling: a cancelled run leaves the lock un-bumped for that upstream.
concurrency:
  group: dependency-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A PR opened with the automatic GITHUB_TOKEN does not trigger
          # `pull_request` workflows -- GitHub suppresses that to prevent
          # recursion. The sync PR would sit with no checks at all, which
          # defeats the point of having a standing "merge me to get current"
          # PR: nobody can tell whether taking it is safe. Checking out with
          # the PAT makes the push (and so the PR) attributable to it, and CI
          # runs. Falls back to GITHUB_TOKEN with a warning below.
          token: ${{ secrets.DOWNSTREAM_SYNC_TOKEN || github.token }}

      # The `secrets` context is not available in a step `if:`, so this is a
      # plain shell test on an env-injected value rather than a conditional step.
      - name: Warn if the PR will land without CI
        env:
          TOKEN: ${{ secrets.DOWNSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::DOWNSTREAM_SYNC_TOKEN is not set. The sync PR will be opened by github-actions, so tests.yml will NOT run on it -- verify it by hand before merging."
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Stdlib-only -- `git ls-remote` and a text substitution. `--no-project`
      # is deliberate: the pin repair must not depend on the project resolving,
      # or a lock this workflow exists to fix could be what stops it running.
      # `--python 3.11` matches the floor in `requires-python`; the script needs
      # `tomllib`, which is 3.11+.
      - name: Refresh the rev pins in pyproject.toml
        id: pins
        run: |
          set -euo pipefail
          uv run --no-project --python 3.11 python scripts/sync_git_pins.py --markdown-table pin-table.md

      - name: Re-resolve the lock against the refreshed pins
        id: relock
        run: |
          set -euo pipefail

          # Scoped to the git deps on purpose. A bare `uv lock --upgrade` would
          # also float every PyPI dependency, turning "pick up the upstream fix"
          # into an unreviewable dependency bump.
          #
          # This runs even when the pins did not move: `pyproject.toml` and
          # `uv.lock` can disagree for other reasons, and re-locking here is how
          # that gets noticed rather than shipped.
          uv lock --upgrade-package optimizers --upgrade-package tribble-clustering

          if git diff --quiet -- pyproject.toml uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Both pins are already at their upstream branch head -- nothing to do."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # A lock that moved while the pins did not means `uv.lock` had fallen
          # out of step with `pyproject.toml` independently of upstream drift.
          # Say so in the PR body rather than letting an unexplained lock diff
          # ride along under a "bump the pins" title.
          if [ ! -s pin-table.md ]; then
            {
              echo '| Dependency | Old | New |'
              echo '|---|---|---|'
              echo '| _(no pin moved)_ | | |'
            } > pin-table.md
            note='> **Note:** no `rev` pin moved -- the lock alone was out of step with `pyproject.toml`.'
          else
            note=''
          fi

          {
            echo "Automated refresh of the git-sourced dependency pins in \`pyproject.toml\`, with \`uv.lock\` re-resolved to match."
            echo
            cat pin-table.md
            echo
            if [ -n "$note" ]; then echo "$note"; echo; fi
            echo "Triggered by: \`${{ github.event_name }}\`${{ github.event.client_payload.repo && format(' from `{0}`', github.event.client_payload.repo) || '' }}"
            echo
            echo "> This branch is machine-owned and force-pushed on every upstream merge."
            echo "> Do not commit to it by hand -- your commit will be overwritten. Push a"
            echo "> fix to the upstream repo instead and let it flow back down."
          } > pr-body.md

      - name: Push the moving sync branch
        if: steps.relock.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH"
          # Both files, always. Committing only the lock is how the two got
          # out of step in the first place -- the `rev` in pyproject.toml is now
          # the authoritative pin, and a lock that names a commit the pin does
          # not is unresolvable by anyone reading the diff.
          git add pyproject.toml uv.lock
          git commit -m "chore(deps): refresh optimizers and tribble-clustering pins to upstream main"
          git push --force origin "$SYNC_BRANCH"

      - name: Open or update the sync PR
        if: steps.relock.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_SYNC_TOKEN || github.token }}
        run: |
          set -uo pipefail
          existing=$(gh pr list --head "$SYNC_BRANCH" --state open --json number -q '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file pr-body.md
            echo "updated #$existing"
            exit 0
          fi

          # Captured rather than run bare, because the likeliest failure here is
          # a repo setting rather than a bug, and the raw GraphQL error names
          # neither the setting nor the remedy. grad-school hit exactly this on
          # its first real scheduled run (2026-08-29): the branch pushed fine
          # and only this step failed, so the bump sat on a ref nobody knew to
          # look at, under an error that read like a code bug.
          if out=$(gh pr create               --title "chore(deps): sync git dependencies to upstream main"               --body-file pr-body.md               --head "$SYNC_BRANCH"               --base main 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"

          COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/main...$SYNC_BRANCH?expand=1"
          if echo "$out" | grep -qi "not permitted to create or approve pull requests"; then
            {
              echo "## Dependency sync could not open its PR"
              echo
              echo "The branch \`$SYNC_BRANCH\` **was pushed successfully** -- the relocked"
              echo "\`uv.lock\` is safe, only the pull request is missing."
              echo "[Open it by hand]($COMPARE), or fix one of these so the next run does it:"
              echo
              echo "1. **Set the \`DOWNSTREAM_SYNC_TOKEN\` secret** (preferred). A PR opened by a"
              echo "   PAT is not \"GitHub Actions creating a PR\", so the restriction does not"
              echo "   apply -- and it separately fixes this PR getting no CI, since one opened"
              echo "   with the automatic GITHUB_TOKEN triggers no \`pull_request\` workflows."
              echo "2. **Or** enable Settings -> Actions -> General -> Workflow permissions ->"
              echo "   \"Allow GitHub Actions to create and approve pull requests\". That works,"
              echo "   but leaves the sync PR with no checks on it."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Branch pushed, but GitHub Actions may not open a PR. Set DOWNSTREAM_SYNC_TOKEN, or enable 'Allow GitHub Actions to create and approve pull requests'. Open manually: $COMPARE"
          else
            echo "::error::Branch pushed, but opening the sync PR failed. Open manually: $COMPARE"
          fi
          exit 1

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    # Two legs, because the accelerator is optional and both states are real.
    #
    # `numpy` is what a fresh checkout does: no C compiler, `tribblefis.kernel`
    # falls back, and the kernel tests skip themselves. That is the leg which
    # keeps "pip install needs no compiler" honest.
    #
    # `compiled` builds the extension so the ~40 parity tests guarding it
    # actually execute. Without it they skip, and CI reports green over a kernel
    # nothing ran -- which is how the compiled/NumPy `exp` divergence sat
    # unnoticed until someone built it by hand.
    name: pytest (${{ matrix.kernel }} kernel)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kernel: [numpy, compiled]
    env:
      # The interpreter every `uv` command below resolves to. This was once a
      # `python-version:` input on setup-uv@v3, which had no such input: the
      # action warned "Unexpected input(s) 'python-version'" and ignored it, so
      # the pin never took effect and the suite ran on whatever Python the runner
      # image happened to ship. `UV_PYTHON` is uv's own mechanism and does bind;
      # uv fetches the interpreter if the image lacks it. See the note on the
      # setup-uv step for why it stays an env var now that the input exists.
      UV_PYTHON: "3.11"
    steps:
      # Both actions run with no inputs, so these major bumps carry no
      # configuration risk; what they buy is the Node 24 runtime. checkout@v4
      # and setup-uv@v3 declared `using: node20`, which GitHub is retiring -- the
      # runner was already force-running them on Node 24 and warning every job.
      # Checked against each tag's action.yml rather than assumed: setup-uv only
      # reached node24 at v7 (v6 is still node20, so the obvious small bump would
      # have fixed nothing), and checkout reached it at v5.
      - uses: actions/checkout@v7

      # v7 is the newest setup-uv major published as a floating tag; the v10.0.1
      # release has no `v10` ref to track, and pinning an exact patch would mean
      # hand-editing this file for every future patch.
      #
      # Newer majors do offer a `python-version:` input, which just sets
      # UV_PYTHON. The env var above stays the single source of truth: it governs
      # uv whatever the action version, and this pin broke in the first place
      # because a version-specific input silently stopped existing. Two
      # mechanisms for one value is how that recurs.
      #
      # enable-cache persists uv's wheel/build cache (keyed on uv.lock) via
      # actions/cache. Without it every run rebuilds the two git dependencies
      # (optimizers, tribble-clustering) from source and re-downloads the
      # numpy/scipy/numba/pandas/matplotlib stack from scratch, on both matrix
      # legs -- most of the wall-clock this workflow was burning before a
      # single test ran.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.kernel }}

      - name: Install dependencies
        run: uv sync --extra dev

      # Same reasoning as the kernel assertion below: a pin that silently stops
      # binding is worse than no pin, because the workflow still looks pinned.
      - name: Confirm the interpreter matches the pin
        run: |
          uv run python - <<'PY'
          import os, sys
          want = os.environ["UV_PYTHON"]
          got = ".".join(map(str, sys.version_info[:2]))
          if got != want:
              raise SystemExit(f"expected Python {want}, got {got}")
          print(f"python under test: {sys.version.split()[0]}")
          PY

      # cython/setuptools are build-time only, so they stay out of the project's
      # dependencies -- `--with` supplies them for this command alone.
      - name: Build the compiled kernel
        if: matrix.kernel == 'compiled'
        run: uv run --with cython --with setuptools python setup_cython.py build_ext --inplace

      # Assert the leg is testing what it claims. Both directions matter: a
      # silently-unbuilt extension turns the `compiled` leg back into a second
      # copy of `numpy` with every kernel test skipped, which is precisely the
      # blind spot this matrix exists to close.
      - name: Confirm the kernel state matches the matrix leg
        run: |
          uv run python - <<'PY'
          from tribblefis import kernel
          want = "${{ matrix.kernel }}" == "compiled"
          if kernel.HAVE_CYTHON_KERNEL != want:
              raise SystemExit(
                  f"expected HAVE_CYTHON_KERNEL={want} on the "
                  f"'${{ matrix.kernel }}' leg, got {kernel.HAVE_CYTHON_KERNEL}"
              )
          print(f"kernel backend under test: {'compiled' if want else 'numpy'}")
          PY

      # -n auto (pytest-xdist) spreads the suite's ~840 tests across the
      # runner's cores instead of running them one at a time in a single
      # process; combined with the uv cache above this is most of the win.
      - name: Run tests
        run: uv run pytest -n auto ${{ github.event_name == 'pull_request' && '-m "not performance"' || '' }}

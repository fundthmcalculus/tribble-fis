[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribble-fis"
version = "0.1.0"
description = "Tribble FIS project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "tribble-clustering>=0.1.8",
    # TODO - Reduce the number of dependencies?
    "scikit-learn",
    "scipy",
    "seaborn",
    "optimizers",
]

[tool.uv.sources]
optimizers = { git = "https://github.com/fundthmcalculus/optimizers.git" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matplotlib",
    "scipy",
    "ucimlrepo>=0.0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tribblefis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-m 'not slow'"
markers = [
    "slow: heavy ODE-simulation/training tests excluded from the default run (run explicitly with `pytest -m slow`)",
]

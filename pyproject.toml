[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribble-fis"
version = "0.1.0"
description = "Tribble FIS project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "numba",
    "tribble-clustering>=0.1.8",
    "matplotlib",
    "ucimlrepo>=0.0.7",
    "optimizers",
]

[tool.uv.sources]
# Tracks the branch; uv.lock pins the commit. Do not roll that pin back before
# optimizers 3a57f91 -- earlier revisions draw the initial population from
# `np.random.default_rng()` with no argument, i.e. fresh OS entropy, so
# `refine_method="optimizers"` ignores its `seed` and returns a different model
# on every call. See the note above `_run_optimizer_search` in
# src/tribblefis/refine.py.
optimizers = { git = "https://github.com/fundthmcalculus/optimizers.git" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "scipy",
    "scikit-learn",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tribblefis"]

[tool.pytest.ini_options]
testpaths = ["tests", "tribble-tree/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
]

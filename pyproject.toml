[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribble-fis"
version = "0.1.0"
description = "Tribble FIS project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "tribble-clustering>=0.1.7",
    # TODO - Reduce the number of dependencies?
    "scikit-learn",
    "scipy",
    "seaborn"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "matplotlib",
    "scipy"
]

[tool.hatch.build.targets.wheel]
packages = ["src/tribblefis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribble-fis"
version = "0.1.0"
description = "Tribble FIS project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "numba",
    "pandas",
    "scikit-learn",
    "tribble-clustering>=0.1.8",
    "matplotlib",
    "ucimlrepo>=0.0.7",
    "optimizers",
]

[tool.uv.sources]
# Pinned to a specific revision to avoid silent drift. Do not roll back before
# optimizers 3a57f91 -- earlier revisions draw the initial population from
# `np.random.default_rng()` with no argument, i.e. fresh OS entropy, so
# `refine_method="optimizers"` ignores its `seed` and returns a different model
# on every call. See the note above `_run_optimizer_search` in
# src/tribblefis/refine.py. When updating, run `uv lock --upgrade-package optimizers`.
# Bumped 4d81121 -> 7ba4fc0 (optimizers main HEAD) to match the revision the
# downstream grad-school superproject pins as its submodule, so that repo's
# reproduce/ preflight PIN-MATCH stops reporting the two as drifted. Forward of
# the 3a57f91 floor above.
optimizers = { git = "https://github.com/fundthmcalculus/optimizers.git", rev = "7ba4fc02738af7045fa3b271f74dace877bd2d4d" }
# Temporary: PyPI's tribble-clustering==0.1.8 is the latest published release
# and its compiled `pcvat` extension is built with -march=native, which SIGILLs
# on any CPU lacking whatever the build machine had (AVX-512, observed on some
# GitHub Actions runners -- see tribble-fis#124). Fixed on the clustering
# repo's default branch (fundthmcalculus/clustering#79, -march=x86-64-v3) but
# not yet cut into a PyPI release, so track the branch via git until it is.
# Pinned here to prevent silent drift (see issue #201). Remove this override
# (and bump the >=0.1.8 floor) once a fixed release ships. When updating, run
# `uv lock --upgrade-package tribble-clustering`.
# Bumped 1dcf331 -> 71dbcc3 (clustering main HEAD) to match the revision the
# downstream grad-school superproject pins as its submodule, so that repo's
# reproduce/ preflight PIN-MATCH stops reporting the two as drifted.
tribble-clustering = { git = "https://github.com/fundthmcalculus/clustering.git", rev = "71dbcc3853bc48733ee46e5a2d78fd43d8d0af12" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
]
docs = [
    "sympy>=1.14.0",
]
cmapss = [
    "h5py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tribblefis"]

[tool.pytest.ini_options]
testpaths = ["tests", "tribble-tree/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
    # Correctness tests -- not benchmarks -- that are simply expensive, because
    # GT2/IT2 antecedent refinement runs an optimizer sub-problem per slot per
    # alpha plane. They are deselected on pull requests and run in full by
    # nightly.yml, which opens an issue when they fail.
    #
    # The boundary is a family, not a stopwatch threshold: everything marked is
    # antecedent refinement. An explicit "over 25s" rule was tried first and
    # rejected -- it put a 24.6s test inside the set and a 25.3s test outside,
    # and membership defined that way churns on runner noise.
    #
    # MEASURE ON CI, ON BOTH LEGS, BEFORE CHANGING THIS LIST. The first version
    # of it was derived from a local profile and was materially wrong, because
    # the local .venv installs tribblefis non-editable and was running pre-#200
    # code (see issue #214). Against real CI numbers, tests that profile put at
    # ~19s were actually the slowest in the suite:
    #
    #     preserves_sigma_ordering_invariant   15s numpy / 137s compiled
    #     does_not_drastically_worsen_rmse     88s numpy /  98s compiled
    #     preserves_ordering_invariant[trap]   57s numpy /  58s compiled
    #
    # Note how far the two legs diverge. The compiled leg is the binding
    # constraint and needs its own numbers; extrapolating from numpy does not
    # work. tests.yml prints --durations=25 on every run for exactly this.
    #
    # DELIBERATELY NOT MARKED: tests/test_refine_compiled_parity.py, despite
    # costing ~148s on the compiled leg. Those parity tests are the documented
    # reason the compiled matrix leg exists at all; deselecting them on PRs
    # would leave the leg running while the thing it guards goes unchecked.
    # They stay, and the budget is met without them.
    #
    # Do not mark a test slow to dodge a genuine regression. If it got slower,
    # that is the finding.
    #
    # #213 asked whether the worst offender here --
    # test_refine_gt2_regressor_antecedents_never_increases_cv_loss[triangular],
    # 4x its [trap] sibling "on identical settings" -- was a fixable perf bug
    # that would let it come back onto the PR path. It is not, and the reason
    # is worth knowing before anyone tries to trim it:
    #
    # The settings are identical; the models are not. `member_function="trap"`
    # with the default `trapz_method="fast"` uses a histogram fitter that takes
    # no component-count argument, so it emits ONE trapezoid per feature/label
    # on unimodal data whatever `n_gaussians` says. `member_function=
    # "triangular"` routes through EM, which honours it, and builds two.
    # Refinement is `for sweep: for slot: <sub_maxfun evaluations>` with every
    # evaluation running the whole model, i.e. O(slots x model size) -- so 2x
    # the memberships costs 4x. Measured 3.80x against a predicted 4.00x.
    #
    # The [triangular] leg is therefore the only one of the pair that exercises
    # multi-component slot refinement at all. Cutting its cost by lowering
    # `n_gaussians` would delete exactly the coverage that makes it worth
    # running. It stays marked, and it stays expensive, on purpose. See
    # tests/test_member_function_component_counts.py.
    "slow: expensive correctness test; deselected on PRs, run by nightly.yml",
]

[tool.mypy]
# Enforce best practices for type checking.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# Ignore missing imports for external packages without type stubs.
ignore_missing_imports = true

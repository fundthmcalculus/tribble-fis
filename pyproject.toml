[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tribble-fis"
version = "0.1.0"
description = "Tribble FIS project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "numba",
    "pandas",
    "scikit-learn",
    "tribble-clustering>=0.1.8",
    "matplotlib",
    "ucimlrepo>=0.0.7",
    "optimizers",
]

[tool.uv.sources]
# Tracks the branch; uv.lock pins the commit. Do not roll that pin back before
# optimizers 3a57f91 -- earlier revisions draw the initial population from
# `np.random.default_rng()` with no argument, i.e. fresh OS entropy, so
# `refine_method="optimizers"` ignores its `seed` and returns a different model
# on every call. See the note above `_run_optimizer_search` in
# src/tribblefis/refine.py.
optimizers = { git = "https://github.com/fundthmcalculus/optimizers.git" }
# Temporary: PyPI's tribble-clustering==0.1.8 is the latest published release
# and its compiled `pcvat` extension is built with -march=native, which SIGILLs
# on any CPU lacking whatever the build machine had (AVX-512, observed on some
# GitHub Actions runners -- see tribble-fis#124). Fixed on the clustering
# repo's default branch (fundthmcalculus/clustering#79, -march=x86-64-v3) but
# not yet cut into a PyPI release, so track the branch via git until it is.
# Remove this override (and bump the >=0.1.8 floor) once a fixed release ships.
tribble-clustering = { git = "https://github.com/fundthmcalculus/clustering.git" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-xdist>=3.8.0",
]
docs = [
    "sympy>=1.14.0",
]
cmapss = [
    "h5py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tribblefis"]

[tool.pytest.ini_options]
testpaths = ["tests", "tribble-tree/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "performance: marks tests as performance benchmarks (deselect with '-m \"not performance\"')",
    # Correctness tests -- not benchmarks -- that are simply expensive, because
    # GT2/IT2 antecedent refinement runs an optimizer sub-problem per slot per
    # alpha plane. They are deselected on pull requests and run in full by
    # nightly.yml, which opens an issue when they fail.
    #
    # The bar for adding a test here is wall-clock, measured, not guessed: the
    # eleven marked today were the only ones above ~25s in a --durations run.
    # One of them alone (test_refine_gt2_regressor_antecedents_never_increases_
    # cv_loss[triangular], 399s) set a hard floor under the whole suite --
    # pytest-xdist can shorten everything else, but never the longest single
    # test. Do not mark a test slow to dodge a genuine regression; if it got
    # slower, that is the finding.
    "slow: expensive correctness test; deselected on PRs, run by nightly.yml",
]

[tool.mypy]
# Enforce best practices for type checking.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
# Ignore missing imports for external packages without type stubs.
ignore_missing_imports = true
